    <script>
        document.getElementById('copy-btn')?.addEventListener('click', () => {
            const traceText = document.getElementById('trace-id-value')?.textContent?.trim() || '';
            if (traceText) {
                navigator.clipboard.writeText(traceText).then(() => {
                    const textEl = document.getElementById('copy-text');
                    const iconEl = document.getElementById('copy-icon');
                    if (textEl) textEl.textContent = 'Trace ID kopiert!';
                    if (iconEl) iconEl.textContent = 'check';
                    setTimeout(() => {
                        if (textEl) textEl.textContent = 'Trace ID kopieren';
                        if (iconEl) iconEl.textContent = 'content_copy';
                    }, 2000);
                }).catch(() => { });
            }
        });
    </script>
